server.port=${SERVER_PORT:8080}

# Import optionnel des variables depuis .env (format KEY=VALUE).
# Spring Boot 2.7 nécessite une extension connue par un PropertySourceLoader.
# On référence donc le même fichier via le suffixe ".properties".
spring.config.import=optional:file:.env.properties

# ===== DATABASE CONFIGURATION =====
# Sans profil "dev", le schéma n'est pas modifié automatiquement (MySQL hors embarqué = none par défaut).
# Pour le local avec Docker : lancer avec spring.profiles.active=dev (voir application-dev.properties).
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:conges_db}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# none = Hibernate ne touche pas au schéma (recommandé sans profil dev). Risqué avec données : éviter create / create-drop.
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:create-drop}

# ===== DOLIBARR API CONFIGURATION =====
dolibarr.url=${DOLIBARR_URL:http://localhost/dolibarr/api/index.php}
dolibarr.api-key=${DOLIBARR_API_KEY:}
# Dolibarr (tables SQL source de vérité pays si même instance MySQL)
dolibarr.database.table-prefix=${DOLIBARR_DB_TABLE_PREFIX:llx_}

# Optional: direct Dolibarr DB access (for balances/leave types when REST endpoints are missing)
dolibarr.db.host=${DOLIBARR_DB_HOST:}
dolibarr.db.port=${DOLIBARR_DB_PORT:3306}
dolibarr.db.name=${DOLIBARR_DB_NAME:}
dolibarr.db.user=${DOLIBARR_DB_USER:}
dolibarr.db.password=${DOLIBARR_DB_PASSWORD:}

spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.deserialization.fail-on-unknown-properties=false

spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect

# ===== JWT SECURITY =====
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:604800000}

# ===== SMTP EMAIL CONFIGURATION =====
# Gmail (587) : STARTTLS — ne pas définir mail.smtp.socketFactory.* pour ce port,
# sinon erreurs SSL/handshake (« Couldn't connect », « PKIX », etc.).
# Pour port 465 (SSL implicite) : MAIL_PORT=465 + spring.mail.properties.mail.smtp.ssl.enable=true à la place de starttls.*
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:your-email@gmail.com}
spring.mail.password=${MAIL_PASSWORD:your-app-password}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# ===== NOTIFICATION SETTINGS =====
app.notification.from.email=${MAIL_FROM_EMAIL:your-email@gmail.com}
app.notification.from.name=${MAIL_FROM_NAME:Gestion des Congés}
app.notification.enabled=true
app.notification.async=${MAIL_ASYNC:true}
# En dev : redirige tous les emails vers une vraie boîte (évite les NDR sur domaines fictifs).
# Laisser vide en prod. Référencé par MAIL_TO_OVERRIDE dans .env.properties.
app.notification.to.override=${MAIL_TO_OVERRIDE:}
# URL du frontend (utilisée dans les liens email). Définir APP_URL dans .env.properties.
app.url=${APP_URL:http://localhost:5175}
# URL du backend (utilisée dans les boutons d'action email). Définir BACKEND_URL dans .env.properties.
app.backend.url=${BACKEND_URL:http://localhost:8080}

# Swagger/OpenAPI Configuration
springdoc.api-docs.path=/api/docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.operationsSorter=method

# RTT France (ledger local + optionnel bypass consommation Dolibarr sur les courtes)
france.rtt.local-ledger-enabled=true
france.rtt.skip-dolibarr-rtt-consume=true
france.rtt.annual-cron=0 5 0 1 1 *

# ===== CORS CONFIGURATION =====
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174,http://localhost:5175,http://localhost:3000}